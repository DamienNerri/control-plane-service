[project]
name = "control-plane"
version = "0.1.0"
description = "Control Plane d'autorisation (RBAC + overrides) avec SDK Python"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Damien", email = "damien.nerri@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
control-plane = "control_plane.main:run"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # style PEP 8
    "F",        # erreurs (imports inutilisés, variables non définies)
    "I",        # tri des imports
    "B",        # bugs fréquents
    "UP",       # syntaxe Python moderne
    "N",        # conventions de nommage
    "S",        # sécurité (règles bandit)
    "SIM",      # simplifications
    "ASYNC",    # pièges de l'asynchrone
    "RUF",      # règles propres à ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert autorisé dans les tests

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "control_plane"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Le domaine ne dépend d'aucune autre couche"
type = "forbidden"
source_modules = ["control_plane.domain"]
forbidden_modules = [
    "control_plane.api",
    "control_plane.services",
    "control_plane.evaluation",
    "control_plane.infrastructure",
    "control_plane.observability",
    "sqlalchemy",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "La logique métier ignore l'API et l'infrastructure"
type = "forbidden"
source_modules = ["control_plane.evaluation", "control_plane.services"]
forbidden_modules = ["control_plane.api", "control_plane.infrastructure"]

[[tool.importlinter.contracts]]
name = "L'infrastructure ne remonte pas vers l'API ni les services"
type = "forbidden"
source_modules = ["control_plane.infrastructure"]
forbidden_modules = ["control_plane.api", "control_plane.services"]
